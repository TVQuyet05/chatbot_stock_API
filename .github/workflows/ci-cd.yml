name: CI/CD Deployment to EC2

on:
  push:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio .
      - name: Lint with ruff
        run: ruff check src tests
      - name: Run unit tests
        run: pytest tests/unit

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/chatbot_stock_API || git clone https://github.com/${{ github.repository }} ~/chatbot_stock_API
            cd ~/chatbot_stock_API
            git pull origin main
            # Re-create .env from secrets
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
            echo "POSTGRES_USER=stocklaw" >> .env
            echo "POSTGRES_PASSWORD=stocklaw_secret" >> .env
            echo "POSTGRES_DB=stocklaw_auth" >> .env
            echo "ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}" >> .env
            sudo docker-compose up -d --build
