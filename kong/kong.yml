_format_version: "3.0"
_transform: true

services:
  - name: stock-law-api
    url: http://api:8000
    routes:
      - name: api-v1
        paths:
          - /api/v1
        strip_path: false
      - name: auth
        paths:
          - /auth
        strip_path: false
      - name: admin
        paths:
          - /admin
        strip_path: false
      - name: portal
        paths:
          - /
        strip_path: false

plugins:
  - name: prometheus
    config:
      per_consumer: true
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Admin-Key
      exposed_headers:
        - X-Process-Time
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 20
      policy: local
